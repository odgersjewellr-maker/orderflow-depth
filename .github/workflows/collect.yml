name: depth-collector
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: depth-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect
        run: node collector.mjs
      - name: Commit data
        if: always()
        run: |
          git config user.name "depth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "no data"
          else
            git commit -m "depth: $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi
